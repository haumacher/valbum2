name: Release

# A tag `valbum-<x.y.z>` builds the server's Debian packages for arm64, amd64 and
# armhf, a signed Android APK, publishes a GitHub Release with all of them and
# rebuilds the APT repository on GitHub Pages. The container image (amd64 and
# arm64, one multi-arch tag) is built from the same platform JARs and pushed to
# ghcr.io and, where configured, to Docker Hub.
#
# The GitHub Release assets are the source of truth; the Pages site is a derived
# view that is rebuilt from scratch on every run, so `workflow_dispatch` without
# a tag republishes the site without building anything.

on:
  push:
    tags:
      - 'valbum-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build and publish, e.g. valbum-1.1.0. Leave empty to only rebuild the APT repository on GitHub Pages from the existing releases.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Two releases must not race on the Pages deployment.
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - name: Parse the tag
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$PUSH_TAG"
          else
            tag="$INPUT_TAG"
          fi
          if [ -z "$tag" ]; then
            echo "No tag given: only the GitHub Pages site is rebuilt."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "build_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$tag" =~ ^valbum-([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not of the form valbum-<major>.<minor>.<patch>, for example valbum-1.1.0."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version="$major.$minor.$patch"
          # Android's versionCode must grow with every release; this derives it
          # from the version, so no state has to be kept between runs.
          build_number=$(( major * 10000 + minor * 100 + patch ))
          echo "Tag $tag -> version $version, Android versionCode $build_number"
          {
            echo "build=true"
            echo "tag=$tag"
            echo "version=$version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Flutter web build
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Build the web app
        working-directory: valbum_ui
        run: |
          flutter pub get
          # The version the About dialog shows (#187); a build without it shows none.
          flutter build web --release \
            --dart-define=VALBUM_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: valbum_ui/build/web
          retention-days: 7

  deb:
    name: Debian package (${{ matrix.arch }})
    needs: [prepare, web]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            arch: arm64
            test_flags: '-DskipTests'
          - platform: linux-x86_64
            arch: amd64
            # The tests run once, on the leg whose JavaCPP platform matches the
            # runner; every push is tested by the CI workflow anyway.
            test_flags: ''
          - platform: linux-armhf
            arch: armhf
            test_flags: '-DskipTests'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Take over the web build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: valbum_ui/build/web
      - name: Set the project version from the tag
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.prepare.outputs.version }} -DgenerateBackupPoms=false
      # The tested leg needs what the CI workflow installs for the same reason: the bundled
      # FFmpeg's device library links xcb and ALSA, which a bare runner does not carry, and
      # `TestFfmpegProgram` runs the program so a missing library fails the build by name
      # (issue #81). The legs that skip the tests never load it.
      - name: Install the system libraries the bundled FFmpeg links
        if: matrix.test_flags == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1 libxcb-shm0 libxcb-shape0 libxcb-xfixes0 \
            libxau6 libxdmcp6 libbsd0 libmd0
          # ALSA was renamed in Ubuntu 24.04; take whichever name the runner has.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2
      - name: Build the Debian package
        run: ./mvnw -B -Djavacpp.platform=${{ matrix.platform }} ${{ matrix.test_flags }} clean install
      - name: Check the package
        run: |
          set -euo pipefail
          deb="image-server/target/valbum_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.deb"
          if [ ! -f "$deb" ]; then
            echo "::error::Expected $deb, but the build produced:"
            ls -l image-server/target/*.deb 2>/dev/null || echo "  (no .deb at all)"
            exit 1
          fi
          dpkg-deb --info "$deb"
          # The bundled FFmpeg links system libraries no artifact ships (#87). They are
          # recommended, not depended on, so only this check keeps them in the package.
          recommends="$(dpkg-deb --field "$deb" Recommends)"
          echo "Recommends: $recommends"
          for lib in libxcb-shape0 libasound2; do
            if ! echo "$recommends" | grep -q "$lib"; then
              echo "::error::The package's Recommends field does not name $lib: $recommends"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: image-server/target/valbum_*.deb
          if-no-files-found: error
          retention-days: 7
      # The container image of #174 is built from this very JAR (the web app bundled in), so the
      # image and the package of one release carry the same bytes and nothing is built twice.
      # armhf has no image: the Java 21 base image exists for amd64 and arm64 only.
      - name: Hand the platform JAR to the container image
        if: matrix.arch != 'armhf'
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.arch }}
          path: image-server/target/image-server-${{ matrix.platform }}-jar-with-dependencies.jar
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Container image
    needs: [prepare, deb]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Take over the platform JARs
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: ${{ runner.temp }}/artifacts
      # The Dockerfile's named context 'jars' holds one JAR per Docker architecture.
      - name: Name the JARs after their architectures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jars"
          mv "$RUNNER_TEMP"/artifacts/jar-amd64/image-server-linux-x86_64-jar-with-dependencies.jar "$RUNNER_TEMP/jars/amd64.jar"
          mv "$RUNNER_TEMP"/artifacts/jar-arm64/image-server-linux-arm64-jar-with-dependencies.jar "$RUNNER_TEMP/jars/arm64.jar"
          ls -l "$RUNNER_TEMP/jars"
      - name: Name the images
        id: names
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${OWNER,,}/valbum"
          images="$ghcr"
          if [ -n "$HUB_TOKEN" ] && [ -n "$HUB_USER" ]; then
            hub="${HUB_IMAGE:-$HUB_USER/valbum}"
            images="$images $hub"
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Docker Hub is not configured (secret DOCKERHUB_TOKEN and variable DOCKERHUB_USERNAME, see RELEASE.md); the image is pushed to $ghcr only."
            echo "hub=false" >> "$GITHUB_OUTPUT"
          fi
          # 'latest' follows the newest release, not the latest run: republishing an older tag
          # must not move it backwards.
          newest=$(git ls-remote --tags --refs origin 'valbum-*' \
                     | sed -n 's|.*refs/tags/valbum-\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -1)
          tags=""
          for image in $images; do
            tags="$tags,$image:$VERSION"
            if [ "$VERSION" = "$newest" ]; then
              tags="$tags,$image:latest"
            fi
          done
          [ "$VERSION" = "$newest" ] || echo "::notice::$VERSION is not the newest release ($newest); 'latest' stays where it is."
          echo "Tags: ${tags#,}"
          {
            echo "tags=${tags#,}"
            echo "ghcr=$ghcr"
            echo "hub_image=${hub:-}"
            # The commit of the tag; github.sha is the default branch on a manual run.
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # The image's own library check (check-libraries), for both architectures, arm64 under QEMU.
      - name: Check the libraries inside the images
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --target check \
            --build-context jars="$RUNNER_TEMP/jars" \
            -f image-server/src/docker/Dockerfile image-server/src
      # The amd64 image as it will be published, started on a copy of the test album before
      # anything leaves the runner.
      - name: Smoke-test the amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load -t valbum:smoke \
            --build-context jars="$RUNNER_TEMP/jars" \
            -f image-server/src/docker/Dockerfile image-server/src
          image-server/src/docker/smoke-test valbum:smoke linux/amd64
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.names.outputs.hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # One build pushes every tag of both registries, so they carry the same manifest digest.
      - name: Build and push the multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: image-server/src
          file: image-server/src/docker/Dockerfile
          build-contexts: jars=${{ runner.temp }}/jars
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.title=VAlbum
            org.opencontainers.image.description=Self-hosted photo and video album server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ steps.names.outputs.revision }}
      - name: Show what was pushed
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GHCR: ${{ steps.names.outputs.ghcr }}
          HUB: ${{ steps.names.outputs.hub_image }}
        run: |
          set -euo pipefail
          for image in "$GHCR" ${HUB:+"$HUB"}; do
            docker buildx imagetools inspect "$image:$VERSION"
          done

  android:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check the signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "A debug-signed APK is never published: it could not update a copy installed with another key."
            echo ""
            echo "Create the keystore once and keep it safe (losing it means no update can ever be installed over this app):"
            echo "  keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload"
            echo "  base64 -w0 upload-keystore.jks"
            echo ""
            echo "Then add, under Settings > Secrets and variables > Actions:"
            echo "  ANDROID_KEYSTORE_BASE64    the output of the base64 command"
            echo "  ANDROID_KEYSTORE_PASSWORD  the keystore password"
            echo "  ANDROID_KEY_ALIAS          upload"
            echo "  ANDROID_KEY_PASSWORD       the key password"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Write the keystore and key.properties
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > valbum_ui/android/app/upload-keystore.jks
          cat > valbum_ui/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build the signed APK
        working-directory: valbum_ui
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }} \
            --dart-define=VALBUM_VERSION=${{ needs.prepare.outputs.version }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/valbum-${{ needs.prepare.outputs.version }}.apk
      - name: Check the signature
        working-directory: valbum_ui
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/valbum-${{ needs.prepare.outputs.version }}.apk"
          ls -lh "$apk"
          # A modern APK carries only the v2/v3 signature, which `keytool -printcert
          # -jarfile` cannot read; apksigner is the tool that can.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found below $sdk/build-tools; the signature cannot be checked and an unchecked APK is not published."
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key. It could not update a copy installed with the release key, so it is not published."
            exit 1
          fi
      - name: Remove the signing material
        if: always()
        run: rm -f valbum_ui/android/app/upload-keystore.jks valbum_ui/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: valbum_ui/build/app/outputs/flutter-apk/valbum-*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [prepare, deb, android]
    # The Debian packages are published even when the Android build failed; the
    # workflow as a whole still shows red in that case.
    if: always() && needs.prepare.outputs.build == 'true' && needs.deb.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: assets
      - name: Collect the APK
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: assets
      - name: Note a missing APK
        if: needs.android.result != 'success'
        run: |
          echo "::warning::The Android job did not succeed (${{ needs.android.result }}); the release carries the Debian packages only."
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VAlbum $VERSION" \
              --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber assets/*

  pages:
    name: APT repository on GitHub Pages
    needs: [prepare, release]
    # Runs after a release, and on a `workflow_dispatch` without a tag, where
    # the build jobs are skipped and the site is rebuilt from what is published.
    if: always() && needs.prepare.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the signing secret
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::Missing repository secret APT_SIGNING_KEY."
            echo "An unsigned APT repository is never published: apt would refuse it, and anyone could serve a package in its place."
            echo ""
            echo "Create the key once:"
            echo "  gpg --quick-generate-key \"VAlbum APT <you@example.com>\" ed25519 sign never"
            echo "  gpg --armor --export-secret-keys <key-id>"
            echo ""
            echo "Then add, under Settings > Secrets and variables > Actions:"
            echo "  APT_SIGNING_KEY         the ASCII-armored private key, including the BEGIN/END lines"
            echo "  APT_SIGNING_PASSPHRASE  only if the key has a passphrase"
            exit 1
          fi
      - name: Install the packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils
      - name: Import the signing key
        id: key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          if [ -z "$key_id" ]; then
            echo "::error::APT_SIGNING_KEY contains no secret key. Export it with: gpg --armor --export-secret-keys <key-id>"
            exit 1
          fi
          echo "Signing key: $key_id"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "key_id=$key_id" >> "$GITHUB_OUTPUT"
      - name: Download the Debian packages of the newest 2 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p debs
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                   --json tagName,isDraft,createdAt \
                   --jq 'map(select(.isDraft | not)) | sort_by(.createdAt) | reverse | .[0:2] | .[].tagName')
          if [ -z "$tags" ]; then
            echo "::error::No published release carries a package; there is nothing to serve."
            exit 1
          fi
          # GitHub Pages sites are limited to about 1 GB and one release is some
          # 270 MB across the three architectures, so only the newest 2 are kept;
          # every older package stays downloadable from its GitHub Release.
          echo "Releases on the site: $(echo "$tags" | tr '\n' ' ')"
          for tag in $tags; do
            echo "::group::$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs --clobber || \
              echo "::warning::Release $tag carries no .deb asset."
            echo "::endgroup::"
          done
          ls -l debs
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: .github/scripts/build-apt-repo.sh debs site "${{ steps.key.outputs.key_id }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
