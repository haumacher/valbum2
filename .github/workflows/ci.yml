name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Java server (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless check
        run: mvn -B -q spotless:check
      # The video renditions of issue #74 are made by the FFmpeg *program* the bundled
      # `org.bytedeco:ffmpeg` artifact ships, and loading it pulls in every native library of that
      # artifact. `libavdevice` links ALSA and X11/xcb, which a bare runner does not carry — the
      # poster frame never needed them, because JavaCV loads only avformat/avcodec, which is why
      # this only broke when transcoding arrived (issue #81). `ldd` on the cached
      # `ffmpeg`/`libjniavdevice.so` names exactly these; libva, libva-drm and libdrm come bundled
      # inside the artifact and need no package.
      - name: Install the system libraries the bundled FFmpeg links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1 libxcb-shm0 libxcb-shape0 libxcb-xfixes0 \
            libxau6 libxdmcp6 libbsd0 libmd0
          # ALSA was renamed in Ubuntu 24.04; take whichever name the runner has.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2
      - name: Build and test
        run: mvn -B clean install

  # The container image of #174, amd64 only and never pushed: the platform JAR with the web app
  # bundled, as the release builds it (the health check asks the app base), the image's own
  # library check, and the image started on a copy of the test album - a video rendition and the
  # face index inside the container, the files it writes owned by PUID:PGID. The release builds
  # both architectures from the packages' JARs.
  docker:
    name: Container image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Build the web app
        working-directory: valbum_ui
        run: |
          flutter pub get
          flutter build web --release
      - name: Build the platform JAR
        run: mvn -B -Djavacpp.platform=linux-x86_64 -DskipTests package
      - name: Hand it to the image
        run: |
          mkdir -p "$RUNNER_TEMP/jars"
          cp image-server/target/image-server-linux-x86_64-jar-with-dependencies.jar "$RUNNER_TEMP/jars/amd64.jar"
      - uses: docker/setup-buildx-action@v3
      - name: Check the libraries inside the image
        run: |
          docker buildx build --platform linux/amd64 --target check \
            --build-context jars="$RUNNER_TEMP/jars" \
            -f image-server/src/docker/Dockerfile image-server/src
      - name: Build the image
        run: |
          docker buildx build --platform linux/amd64 --load -t valbum:ci \
            --build-context jars="$RUNNER_TEMP/jars" \
            -f image-server/src/docker/Dockerfile image-server/src
      - name: Smoke-test the image
        run: image-server/src/docker/smoke-test valbum:ci linux/amd64

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valbum_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build web
      # The Android build runs on the Gradle wrapper checked in below `android/`; it must
      # keep working on the JDK the server requires (issue #33).
      - run: flutter build apk --debug
