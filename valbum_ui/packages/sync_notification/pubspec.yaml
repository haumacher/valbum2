name: sync_notification
description: >-
  The notification of a camera-roll upload — its progress while it runs, and
  the permission to show it (issue #300). Part of VAlbum2, not published.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: de.haumacher.valbum.sync_notification
        pluginClass: SyncNotificationPlugin
