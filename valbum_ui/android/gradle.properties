# The camera-roll upload runs as a foreground work of the type dataSync, so that it goes on with
# the screen off (issue #300): this makes the workmanager plugin declare
# FOREGROUND_SERVICE_DATA_SYNC and the dataSync type of WorkManager's foreground service. The Play
# Console asks for a declaration of that type.
workmanager.enableDataSyncForegroundService=true
